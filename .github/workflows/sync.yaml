name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

permissions: {}

env:
  GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        run: |
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=variable
