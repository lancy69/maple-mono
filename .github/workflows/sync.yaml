name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main
